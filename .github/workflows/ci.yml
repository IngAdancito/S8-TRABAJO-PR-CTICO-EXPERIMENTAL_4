name: CI/CD - Django Tests + Docker Build

on:
  push:
    branches: [master, ci-setup]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gcs_app_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run migrations
        run: python manage.py migrate
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: gcs_app_db
          DB_USER: postgres
          DB_PASSWORD: postgres
      - name: Run tests
        run: python manage.py test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: gcs_app_db
          DB_USER: postgres
          DB_PASSWORD: postgres

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gcs-app:latest
          outputs: type=docker,dest=/tmp/gcs-app.tar
      - name: Upload Docker image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcs-app-docker-image
          path: /tmp/gcs-app.tar
          retention-days: 7
